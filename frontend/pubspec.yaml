name: village_app
description: Village — connecting elders with trusted volunteers.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Mapping — works on Flutter web, no paid API key needed
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # Firebase
  firebase_core: ^3.1.0
  cloud_firestore: ^5.1.0
  firebase_auth: ^5.1.0

  # Animation helpers (pulsing marker)
  flutter_animate: ^4.5.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
